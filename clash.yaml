# ===== GitHub 公开配置顶部脱敏占位（用于通过 Clash Verge 订阅校验，真实连接由本地 Merge 覆盖） =====
proxy-providers:
  KKK:
    { type: http, url: "https://example.com", interval: 86400 }
  CF.live:
    { type: http, url: "https://example.com", interval: 86400 }
  CF.art:
    { type: http, url: "https://example.com", interval: 86400 }
proxies:
  - { name: 🇺🇸 美国-1, server: 127.0.0.1, port: 443, type: vmess, uuid: 00000000-0000-0000-0000-000000000000, alterId: 0, cipher: auto }
  - { name: 🇺🇸 美国-2, server: 127.0.0.1, port: 443, type: vmess, uuid: 00000000-0000-0000-0000-000000000000, alterId: 0, cipher: auto }
  - { name: 🇺🇸 美国-3, server: 127.0.0.1, port: 443, type: vmess, uuid: 00000000-0000-0000-0000-000000000000, alterId: 0, cipher: auto }
  - { name: 🇨🇭 瑞士-1, server: 127.0.0.1, port: 443, type: vmess, uuid: 00000000-0000-0000-0000-000000000000, alterId: 0, cipher: auto }
  - { name: 🇨🇭 瑞士-2, server: 127.0.0.1, port: 443, type: vmess, uuid: 00000000-0000-0000-0000-000000000000, alterId: 0, cipher: auto }
  - { name: 🇨🇭 瑞士-3, server: 127.0.0.1, port: 443, type: vmess, uuid: 00000000-0000-0000-0000-000000000000, alterId: 0, cipher: auto }
# ===== 全局配置 =====
port: 7890
socks-port: 7891
redir-port: 7892
mixed-port: 7893
tproxy-port: 7894
allow-lan: true
bind-address: "*"
ipv6: false
unified-delay: true
tcp-concurrent: true
log-level: info
find-process-mode: strict
global-client-fingerprint: chrome
keep-alive-idle: 600
keep-alive-interval: 15

# GeoData 模式（更快的规则匹配）
geodata-mode: true
geodata-loader: standard
geox-url:
  geoip: "https://cdn.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geoip.dat"
  geosite: "https://cdn.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geosite.dat"

# 配置持久化
profile:
  store-selected: true
  store-fake-ip: true

# 控制面板
external-controller: 0.0.0.0:9090
secret: "123456"
external-ui: "/etc/mihomo/run/ui"
external-ui-name: zashboard
external-ui-url: "https://github.com/Zephyruso/zashboard/archive/refs/heads/gh-pages.zip"

# 实验性功能
# experimental:
#   ignore-resolve-fail: true

# 流量嗅探(建议启用)
sniffer:
  enable: true
  parse-pure-ip: true
  sniff:
    HTTP:
      ports: [80, 8080-8880]
      override-destination: true
    TLS:
      ports: [443, 8443]
    QUIC:
      ports: [443, 8443]
  skip-domain:
    - "+.apple.com"
    - "+.icloud.com"

# ===== TUN 模式 =====
tun:
  enable: true
  stack: mixed
  dns-hijack: ["any:53"]
  auto-route: true
  auto-redirect: true
  auto-detect-interface: true

# DNS模块
dns:
  enable: true
  listen: 0.0.0.0:7874
  ipv6: false
  respect-rules: true
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
    - "conntest.nintendowifi.net"
    - "ctest.cdn.nintendo.net"
    - "+.srv.nintendo.net"
    - "+.nintendo.net"
    - "+.xboxlive.com"
    - "+.msftconnecttest.com"
    - "+.msftncsi.com"
    - "teredo.ipv6.microsoft.com"
  nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
  proxy-server-nameserver:
    - https://dns.alidns.com/dns-query
  nameserver-policy:
    "geosite:cn": ["https://dns.alidns.com/dns-query", "https://doh.pub/dns-query"]
    "geosite:apple-cn": ["https://dns.alidns.com/dns-query", "https://doh.pub/dns-query"]
    "+.music.apple.com,+.blobstore.apple.com,+.mzstatic.com,+.cdn-apple.com,+.icloud.com,+.icloud-content.com,aod.itunes.apple.com,aod-ssl.itunes.apple.com,audio.itunes.apple.com,audio-ssl.itunes.apple.com,streamingaudio.itunes.apple.com,mvod.itunes.apple.com":
      ["https://dns.alidns.com/dns-query", "https://doh.pub/dns-query"]
    "+.cdn.nintendo.net,+.hac.lp1.d4c.nintendo.net,assets1.xboxlive.com,assets2.xboxlive.com,dlassets.xboxlive.com,dlassets2.xboxlive.com,xvcf1.xboxlive.com,xvcf2.xboxlive.com,+.xboxlive.cn,+.windowsupdate.com,+.delivery.mp.microsoft.com,+.update.microsoft.com,download.microsoft.com,+.officecdn.microsoft.com,+.sfx.ms":
      ["https://dns.alidns.com/dns-query", "https://doh.pub/dns-query"]
    "geosite:geolocation-!cn":
      ["https://dns.cloudflare.com/dns-query", "https://dns.google/dns-query"]
