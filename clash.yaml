# 出站策略
# 注意锚点必须放在引用的上方，可以集中把锚点全部放yaml的顶部。
pr:
  &pr {
    type: select,
    proxies:
      [
        🚀 手选主流,
        🇺🇸 US+,
        🇨🇭 CH+,
        🏴‍☠️ CF,
        🇺🇸 US,
        🇭🇰 HK,
        🇯🇵 JP,
        🇼🇸 TW,
        🇸🇬 SG,
        🇰🇷 KR,
        🏎️ 速度优选,
        🚑 故障转移,
        🎯 手选节点,
        DIRECT,
      ],
  }
proxy-groups:
  - {
      name: 🚀 手选主流,
      type: select,
      proxies: [🇺🇸 US+, 🇨🇭 CH+, 🇺🇸 US, 🇭🇰 HK, 🇯🇵 JP, 🇼🇸 TW, 🇸🇬 SG, 🇰🇷 KR],
    }
  - {
      name: 🏎️ 速度优选,
      type: url-test,
      use: [KKK],
      lazy: true,
      tolerance: 50,
      interval: 300,
      filter: "(?=.*(美|US|(?i)States|American|港|HK|(?i)Hong|日本|JP|🇯🇵|(?i)Japan|台|TW|(?i)Taiwan|新|狮|獅|SG|(?i)Singapore|韩|韓|朝|KR|(?i)Korea))^((?!(免费|试用|更新|海外|失联)).)*$",
    }
  - {
      name: 🚑 故障转移,
      type: fallback,
      interval: 300,
      proxies: [🇺🇸 US+, 🇨🇭 CH+, 🇺🇸 US, 🇯🇵 JP, 🇼🇸 TW, 🇸🇬 SG, 🇰🇷 KR, 🇭🇰 HK],
    }
  - {
      name: 🎯 手选节点,
      type: select,
      use: [KKK],
      include-all: false,
      filter: "^((?!(美|US|日本|JP|🇯🇵|台|TW|港|HK|韩|韓|朝|KR|新加坡|狮|獅|SG|瑞士|免费|试用|更新|海外|失联)).)*$",
    }
  - {
      name: Global,
      <<: *pr,
      icon: "https://raw.githubusercontent.com/Vbaethon/HOMOMIX/refs/heads/main/Icon/Color/Large/Global.png",
    }
  - {
      name: GMedia,
      <<: *pr,
      icon: "https://raw.githubusercontent.com/Vbaethon/HOMOMIX/refs/heads/main/Icon/Color/Large/Pornhub.png",
    }
  - {
    name: AI,
    type: select,
    proxies:
      [🇺🇸 美国-3, 🚀 手选主流, 🇺🇸 US+, 🇨🇭 CH+, 🏴‍☠️ CF, 🇺🇸 US, 🇯🇵 JP, 🇼🇸 TW, 🇸🇬 SG, 🇰🇷 KR, 🏎️ 速度优选, 🚑 故障转移, 🎯 手选节点],
    icon: "https://raw.githubusercontent.com/Vbaethon/HOMOMIX/refs/heads/main/Icon/Color/Large/AI.png",
